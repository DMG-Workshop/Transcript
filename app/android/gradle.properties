org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 reads only its new DSL, which the Flutter Gradle plugin does not yet apply
# cleanly — the build fails when the plugin is applied from app/build.gradle.kts.
# Flutter's own diagnostic recommends opting out until it supports the new interface.
# Harmless on AGP 8, which this project pins.
android.newDsl=false
