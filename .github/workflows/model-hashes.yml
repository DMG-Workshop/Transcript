name: Compute Whisper model hashes

# One-off diagnostic: this sandbox's dev environment cannot reach huggingface.co, so
# this runs on a GitHub-hosted runner (which can) to get the real SHA-256 of each
# ggml model WhisperCatalog ships. Manual trigger only; not part of normal CI.
on:
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash each model
        run: |
          for id in tiny base small; do
            url="https://huggingface.co/ggml-org/whisper.cpp/resolve/main/ggml-$id.bin"
            echo "== $id =="
            curl -fL --retry 3 -o "ggml-$id.bin" "$url"
            sha256sum "ggml-$id.bin"
            rm -f "ggml-$id.bin"
          done
